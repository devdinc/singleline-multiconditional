name: Minestom tests

on:
  push:
    branches: [stable, dev]
    paths: ['**', '.github/workflows/**']
  pull_request:
    branches: [stable, dev]
    paths: ['**', '.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: minestom-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare scripts, tests, and package dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/0_scripts "$RUNNER_TEMP/package-deps"
          rsync -av src/ tests/0_scripts/
          if [[ -d -tests ]]; then
            cp -R -- -tests/. tests/
          fi

          install_package() {
            local url="$1"
            local name
            name="$(basename "${url%%#*}" .git)"
            local dir="$RUNNER_TEMP/package-deps/$name"

            if [[ -d "$dir/.git" ]]; then
              return
            fi

            git clone --depth 1 "$url" "$dir"
            if [[ -d "$dir/src" ]]; then
              rsync -av "$dir/src/" tests/0_scripts/
            fi

            if [[ -f "$dir/package.txt" ]]; then
              while IFS= read -r line; do
                line="${line#packages:}"
                for dependency in $line; do
                  install_package "$dependency"
                done
              done < <(grep '^packages:' "$dir/package.txt" || true)
            fi
          }

          while IFS= read -r line; do
            line="${line#packages:}"
            for dependency in $line; do
              install_package "$dependency"
            done
          done < <(grep '^packages:' package.txt || true)

      - name: Run Skript tests
        uses: devdinc/skript-minestom-test-action@main
        with:
          test_script_directory: tests
          test_framework_url: https://raw.githubusercontent.com/devdinc/runtime-test-framework/main/src/runtime-test-framework.sk
